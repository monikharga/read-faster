name: Rewrite All Articles

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-update
  cancel-in-progress: true

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check AI key is available
        run: |
          if [ -n "$AI_API_KEY" ]; then
            echo "AI key: configured (length ${#AI_API_KEY})"
          else
            echo "AI key: NOT RECEIVED — secret READFAST is empty or missing"
          fi
        env:
          AI_API_KEY: ${{ secrets.READFAST }}

      - name: Rewrite all existing articles with AI
        run: node scripts/rewrite-existing.mjs
        env:
          AI_API_KEY: ${{ secrets.READFAST }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: rewrite all articles with AI"
          git push